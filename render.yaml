services:
  - type: web
    name: sistem-bi-unimor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python SISTEM_UTS_BI.py --no-browser
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
